name: Deploy
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - run: |
          npm ci
          npm run build
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: _static
